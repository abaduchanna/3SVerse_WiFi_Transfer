name: Build PC EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install nuitka

      # Standalone (onedir) on purpose: a onefile exe self-extracts into
      # %TEMP% at runtime, which antivirus static AI treats as packer
      # behavior (same rationale as the License Studio build).
      - name: Build with Nuitka (standalone)
        shell: cmd
        timeout-minutes: 40
        run: >
          python -m nuitka --standalone --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --windows-console-mode=disable
          --company-name="3S Verse"
          --product-name="3SVerse WiFi Transfer"
          --file-version="1.0.0.0" --product-version="1.0.0.0"
          --file-description="3SVerse WiFi Transfer (PC receiver)"
          --output-dir=build pc\pc_server.py

      - name: Zip standalone folder
        shell: pwsh
        run: |
          Compress-Archive -Path build\pc_server.dist\* `
            -DestinationPath 3SVerse-WiFi-Transfer-PC-v1.0.0-standalone.zip -Force
          Get-Item 3SVerse-WiFi-Transfer-PC-v1.0.0-standalone.zip | Select-Object Name, Length

      - name: Attach PC zip to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: xfer-v1.0.0
          name: 3SVerse WiFi Transfer v1.0.0
          body: |
            Local WiFi file transfer - phone to PC. No internet, no cloud.

            - `3SVerse-WiFi-Transfer-PC-*.zip` - PC receiver (run `pc_server.exe`)
            - `3SVerse-WiFi-Transfer-Android-*.apk` - Android app (side-load)

            Both devices must be on the SAME WiFi router network.
          files: 3SVerse-WiFi-Transfer-PC-v1.0.0-standalone.zip
          allow_updates: true
          make_latest: true
