name: Build PC EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # Pure-Go cross compile: ONE static exe, no self-extraction, no runtime
      # dependencies - the cleanest possible profile for antivirus (SentinelOne
      # etc.). No GUI toolkit, no zip folder - just pc_server.exe.
      - name: Read version
        run: echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_ENV

      # Deterministic Explorer icon + version info: regenerated from
      # pc/versioninfo.json (IconPath -> brand/3sverse_icon.ico) on every
      # build so the exe in File Explorer always carries the current 3SV mark.
      - name: Regenerate Windows resources (3SV icon + version info)
        working-directory: pc
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.0
          "$(go env GOPATH)/bin/goversioninfo" -o=rsrc_windows_amd64.syso

      - name: Build Windows exe
        working-directory: pc
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -H=windowsgui" \
            -o "../3SVerse-WiFi-Transfer-PC-v${VERSION}.exe" .
          # Guard: PE subsystem MUST be 2 (GUI). Without -H=windowsgui Go
          # builds a console app and a black CLI window opens next to the UI.
          python3 -c "import struct,os; f='../3SVerse-WiFi-Transfer-PC-v${VERSION}.exe'; d=open(f,'rb').read(); pe=struct.unpack_from('<I',d,0x3C)[0]; sub=struct.unpack_from('<H',d,pe+0x5C)[0]; print('PE subsystem:',sub,'(2=GUI,3=console)'); assert sub==2, 'exe is still a CONSOLE app'"
          file "../3SVerse-WiFi-Transfer-PC-v${VERSION}.exe" || true
          ls -la ..

      - name: Smoke test (linux build serves /hello)
        working-directory: pc
        run: |
          go build -o /tmp/pcsrv .
          /tmp/pcsrv -dir /tmp/xfer_smoke & SRVPID=$!
          sleep 2
          curl -sf http://127.0.0.1:8765/hello | grep -q '"ok":true'
          echo "smoke test OK"
          kill $SRVPID

      - name: Attach EXE to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: xfer-v${{ env.VERSION }}
          name: 3SVerse WiFi Transfer v${{ env.VERSION }}
          body: |
            Local WiFi file transfer - phone to PC. No internet, no cloud.

            - `3SVerse-WiFi-Transfer-PC-v*.exe` - single-file PC receiver (no install). Run it and the Studio-branded dashboard opens in your browser.
            - `3SVerse-WiFi-Transfer-Android-v*.apk` - Android app (side-load)

            Both devices must be on the SAME WiFi router network.
          files: 3SVerse-WiFi-Transfer-PC-v${{ env.VERSION }}.exe
          allow_updates: true
          make_latest: true
