name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build signed release APK (stable keystore)
        run: gradle assembleRelease
        env:
          XFER_KEYSTORE_B64: ${{ secrets.XFER_KEYSTORE_B64 }}
          XFER_STORE_PASS: ${{ secrets.XFER_STORE_PASS }}
          XFER_KEY_PASS: ${{ secrets.XFER_KEY_PASS }}
          XFER_KEY_ALIAS: ${{ secrets.XFER_KEY_ALIAS }}

      # Release assets do NOT count against artifact storage quota
      # (no upload-artifact - same pattern as POS / Studio repos).
      - name: Read version
        run: echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_ENV

      - name: Rename APK for release
        run: |
          mkdir rel
          cp app/build/outputs/apk/release/3SVerse_WiFi_Transfer-release.apk \
             "rel/3SVerse-WiFi-Transfer-Android-v${VERSION}.apk"
          ls -la rel/

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: xfer-v${{ env.VERSION }}
          name: 3SVerse WiFi Transfer v${{ env.VERSION }}
          body: |
            Local WiFi file transfer - phone to PC. No internet, no cloud.

            - `3SVerse-WiFi-Transfer-PC-v*.exe` - single-file PC receiver (no install)
            - `3SVerse-WiFi-Transfer-Android-v*.apk` - Android app (side-load)

            Both devices must be on the SAME WiFi router network.

            **Install tip:** if an older version is already installed, the new APK
            installs right over it (same signature). If Play Protect warns, choose
            "More details" > "Install anyway". Android 8.0+ required.
          files: rel/3SVerse-WiFi-Transfer-Android-v${{ env.VERSION }}.apk
          allow_updates: true
          make_latest: true
