name: Recover signing key (temporary, one-shot)

# TEMPORARY recovery job: the operator's local keystore copy was lost to an
# environment reset. The only surviving copy is this repo's XFER_KEYSTORE_B64
# secret. This workflow decodes it and drops it into the PRIVATE License
# Server repo so the operator can pull it back down. It never runs on push
# and must be deleted right after the one-shot recovery completes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Drop keystore into private License Server repo
        env:
          KEYSTORE_B64: ${{ secrets.XFER_KEYSTORE_B64 }}
          PUSH_TOKEN: ${{ secrets.RECOVERY_PUSH_TOKEN }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/k.bin
          test -s /tmp/k.bin || (echo "decode failed" && exit 1)
          UP_B64=$(base64 -w0 /tmp/k.bin)
          CODE=$(curl -s -o /tmp/put.json -w "%{http_code}" -X PUT \
            -H "Authorization: token $PUSH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/abaduchanna/3SVerse_License_Server/contents/ledger/.keyrecovery/xfer_keystore.b64 \
            -d "{\"message\":\"key recovery drop\",\"content\":\"$UP_B64\"}")
          echo "PUT status: $CODE"
          head -c 200 /tmp/put.json
          test "$CODE" = "201"
